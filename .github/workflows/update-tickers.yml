name: Update Ticker Database

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tickers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance requests beautifulsoup4

      - name: Run ticker update script
        run: python scripts/update_tickers.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/ticker-data.ts
          if git diff --cached --quiet; then
            echo "No changes to ticker database."
          else
            git commit -m "Update ticker database from Wikipedia and CoinGecko"
            git push
          fi
